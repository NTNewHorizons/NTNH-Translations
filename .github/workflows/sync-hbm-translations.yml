name: Sync HBM Translations

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Crowdin branch to upload to
        required: false
        default: main
      diagnose_only:
        description: Only list Crowdin branches/files; do not upload
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [hbm-source-updated, hbm-locales-updated]
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: sync-hbm-translations
  cancel-in-progress: false

jobs:
  sync:
    name: Sync hbm en_US source and import bundled locales
    runs-on: ubuntu-latest

    env:
      CROWDIN_BRANCH: ${{ inputs.branch || 'main' }}

    steps:
      - name: Checkout NTNH-Translations repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.UNIVERSAL_FINE }}
          fetch-depth: 0

      - name: Checkout HBM mod repository
        uses: actions/checkout@v4
        with:
          repository: NTNewHorizons/Hbm-s-Nuclear-Tech-GIT
          ref: space-travel-twopointfive
          path: hbm-upstream
          token: ${{ secrets.UNIVERSAL_FINE }}
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync hbm en_US source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SRC="hbm-upstream/src/main/resources/assets/hbm/lang/en_US.lang"
          DST="config/txloader/forceload/hbm/lang/en_US.properties"

          if [ ! -f "$SRC" ]; then
            echo "::error::Source file not found in HBM mod repo: $SRC"
            exit 1
          fi

          mkdir -p "$(dirname "$DST")"

          # Strip BOM and CRLF so the Crowdin source matches the repo format
          sed '1s/^\xEF\xBB\xBF//' "$SRC" | sed 's/\r$//' > "$DST.tmp"

          if [ -f "$DST" ] && diff -q "$DST" "$DST.tmp" > /dev/null 2>&1; then
            rm "$DST.tmp"
            echo "en_US source unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv "$DST.tmp" "$DST"
            echo "en_US source updated."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage locale files and detect changes
        id: locales
        shell: bash
        run: |
          set -euo pipefail

          SRC_DIR="hbm-upstream/src/main/resources/assets/hbm/lang"
          DST_DIR="config/txloader/forceload/hbm/lang"
          LOCK=".github/hbm-locales.lock"

          # Only keys present in the current en_US source are valid Crowdin strings
          sed '1s/^\xEF\xBB\xBF//' "$SRC_DIR/en_US.lang" | grep -oE '^[^=[:space:]#]+' | sort -u > "$RUNNER_TEMP/source.keys"

          declare -A newhash
          staged_locales=()

          while IFS= read -r f; do
            loc="$(basename "$f" .lang)"
            if [ "$loc" = "en_US" ]; then continue; fi

            target="$DST_DIR/$loc.properties"
            if [ ! -f "$target" ]; then
              echo "skip $loc (not a Crowdin target language)"
              continue
            fi

            # Keep only key=value lines whose key exists in en_US; drop // comments and stale keys
            awk -F= -v keysfile="$RUNNER_TEMP/source.keys" '
              BEGIN { while ((getline k < keysfile) > 0) keys[k] = 1 }
              { sub(/\r$/, "") }
              /^[[:space:]]*[#!]/ { next }
              /^[[:space:]]*\/\// { next }
              /^[[:space:]]*$/ { next }
              { key = $1; sub(/[[:space:]]+$/, "", key); if (key in keys) print }' \
              "$f" > "$target"

            newhash["$loc"]="$(sha256sum "$target" | awk '{print $1}')"
            staged_locales+=("$loc")
          done < <(find "$SRC_DIR" -maxdepth 1 -name '*.lang' | sort)

          tmp_lock="$RUNNER_TEMP/hbm-locales.lock"
          : > "$tmp_lock"
          changed=()
          if [ "${#staged_locales[@]}" -gt 0 ]; then
            while IFS= read -r loc; do
              echo "$loc ${newhash[$loc]}" >> "$tmp_lock"
              old="$(awk -v l="$loc" '$1 == l { print $2 }' "$LOCK" 2>/dev/null || true)"
              if [ "$old" != "${newhash[$loc]}" ]; then
                changed+=("$loc")
              fi
            done < <(printf '%s\n' "${staged_locales[@]}" | sort)
          fi

          printf 'changed=%s\n' "${changed[*]:-}" >> "$GITHUB_OUTPUT"
          echo "Changed locales: ${changed[*]:-none}"

      - name: Install Crowdin CLI
        if: steps.source.outputs.changed == 'true' || steps.locales.outputs.changed != '' || inputs.diagnose_only
        run: npm install -g @crowdin/cli

      - name: Inspect Crowdin project (diagnostic)
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN_2 }}
        run: |
          set -euo pipefail
          echo "::group::Branches"
          curl -s -H "Authorization: Bearer $CROWDIN_PERSONAL_TOKEN" \
            "https://api.crowdin.com/api/v2/projects/$CROWDIN_PROJECT_ID/branches?limit=100" \
            | jq -r '.data[]?.data | "\(.id)\t\(.name)"' || true
          echo "::endgroup::"
          echo "::group::Source files (no branch)"
          crowdin file list -c crowdin-hbm.yml --tree --no-progress || true
          echo "::endgroup::"
          echo "::group::Source files (branch '$CROWDIN_BRANCH')"
          crowdin file list -b "$CROWDIN_BRANCH" -c crowdin-hbm.yml --tree --no-progress || true
          echo "::endgroup::"

      # Upload the source first so it exists in Crowdin and new en_US keys are known
      - name: Upload en_US source to Crowdin
        if: (steps.source.outputs.changed == 'true' || steps.locales.outputs.changed != '') && !inputs.diagnose_only
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN_2 }}
        run: |
          crowdin upload sources \
            -b "$CROWDIN_BRANCH" \
            -c crowdin-hbm.yml \
            --no-progress

      - name: Upload changed locale translations to Crowdin
        if: steps.locales.outputs.changed != '' && !inputs.diagnose_only
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN_2 }}
        shell: bash
        run: |
          set -euo pipefail

          DST_DIR="config/txloader/forceload/hbm/lang"
          read -r -a changed <<< "${{ steps.locales.outputs.changed }}"

          # Temporarily drop unchanged locale files so only changed ones get uploaded
          for f in "$DST_DIR"/*.properties; do
            loc="$(basename "$f" .properties)"
            if [ "$loc" = "en_US" ]; then continue; fi
            keep=0
            for c in "${changed[@]}"; do
              if [ "$c" = "$loc" ]; then keep=1; fi
            done
            if [ "$keep" = "0" ]; then rm -f "$f"; fi
          done

          crowdin upload translations \
            -b "$CROWDIN_BRANCH" \
            -c crowdin-hbm.yml \
            --auto-approve-imported \
            --no-progress

      - name: Commit and push changes
        if: (steps.source.outputs.changed == 'true' || steps.locales.outputs.changed != '') && !inputs.diagnose_only
        shell: bash
        run: |
          set -euo pipefail

          LANG_DIR="config/txloader/forceload/hbm/lang"

          # Commit the en_US source change first (survives the restore below)
          if [ "${{ steps.source.outputs.changed }}" = "true" ]; then
            git add "$LANG_DIR/en_US.properties"
            git commit -m "🌐 Sync hbm en_US source from NTNH mod (spacetravel-two-pointfive)"
          fi

          # Restore locale files that were only staged for upload
          git checkout -- "$LANG_DIR"

          # Record the imported locale hashes
          if [ -n "${{ steps.locales.outputs.changed }}" ]; then
            cp "$RUNNER_TEMP/hbm-locales.lock" .github/hbm-locales.lock
            git add .github/hbm-locales.lock
            if ! git diff --staged --quiet; then
              git commit -m "🔒 Record imported hbm locale hashes"
            fi
          fi

          git fetch origin main
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git rebase origin/main
            git push origin main
          else
            echo "Nothing to push."
          fi
