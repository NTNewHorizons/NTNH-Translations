name: Sync Translations

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync en_US files from NTNH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NTNH-Translations repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.UNIVERSAL_FINE }}
          fetch-depth: 0

      - name: Checkout NTNH repository (updates/upcoming)
        uses: actions/checkout@v4
        with:
          repository: NTNewHorizons/NTNH
          ref: updates/upcoming
          path: ntnh-upstream
          token: ${{ secrets.UNIVERSAL_FINE }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync en_US files from NTNH upstream
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_DIR="ntnh-upstream/config"
          WORK_DIR="${GITHUB_WORKSPACE}/config"

          new=0
          updated=0
          unchanged=0
          orphaned=0

          # Helper: swap .properties <-> .lang
          swap_ext() {
            local path="$1"
            local base="${path%.*}"
            local ext="${path##*.}"
            if [ "$ext" = "properties" ]; then
              echo "${base}.lang"
            elif [ "$ext" = "lang" ]; then
              echo "${base}.properties"
            else
              echo "$path"
            fi
          }

          echo "Scanning upstream NTNH (updates/upcoming) for en_US files..."
          echo ""

          # ── 1. Pull all en_US files from upstream ──
          while IFS= read -r -d '' upstream_file; do
            relpath="${upstream_file#$UPSTREAM_DIR/}"
            basename="$(basename "$upstream_file")"

            if [[ ! "$basename" == en_US.* ]]; then
              continue
            fi

            local_file="$WORK_DIR/$relpath"
            local_alt="$(swap_ext "$local_file")"

            # Prefer same extension; fallback to swapped extension if local exists
            if [ -f "$local_file" ]; then
              target="$local_file"
            elif [ -f "$local_alt" ]; then
              target="$local_alt"
              echo "  ↻ Extension mismatch: upstream $relpath → local ${target#$WORK_DIR/}"
            else
              target="$local_file"
            fi

            mkdir -p "$(dirname "$target")"

            # Strip BOM and CRLF
            sed '1s/^\xEF\xBB\xBF//' "$upstream_file" | sed 's/\r$//' > "$target.tmp"

            if [ -f "$target" ]; then
              if diff -q "$target" "$target.tmp" > /dev/null 2>&1; then
                rm "$target.tmp"
                unchanged=$((unchanged + 1))
              else
                mv "$target.tmp" "$target"
                echo "  ✓ Updated: ${target#$WORK_DIR/}"
                updated=$((updated + 1))
              fi
            else
              mv "$target.tmp" "$target"
              echo "  ✓ New:     ${target#$WORK_DIR/}"
              new=$((new + 1))
            fi
          done < <(find "$UPSTREAM_DIR" -type f -print0 2>/dev/null || true)

          # ── 2. Warn about orphaned local en_US files ──
          while IFS= read -r -d '' local_file; do
            relpath="${local_file#$WORK_DIR/}"
            basename="$(basename "$local_file")"

            if [[ ! "$basename" == en_US.* ]]; then
              continue
            fi

            upstream_file="$UPSTREAM_DIR/$relpath"
            upstream_alt="$(swap_ext "$upstream_file")"

            if [ ! -f "$upstream_file" ] && [ ! -f "$upstream_alt" ]; then
              echo "  ⚠️  Orphaned: $relpath"
              orphaned=$((orphaned + 1))
            fi
          done < <(find "$WORK_DIR" -type f -print0 2>/dev/null || true)

          echo ""
          echo "Summary:"
          echo "  New files added:     $new"
          echo "  Existing updated:    $updated"
          echo "  Unchanged:           $unchanged"
          echo "  Orphaned local:      $orphaned"

      - name: Commit and push changes
        run: |
          rm -rf ntnh-upstream

          git add config

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            CHANGED=$(git diff --staged --name-only | wc -l)
            echo "Committing $CHANGED changed file(s)..."

            git commit -m "🌐 Sync en_US translations from NTNH (updates/upcoming)"
            git push origin main
            echo "✓ Pushed changes to main branch"
          fi
